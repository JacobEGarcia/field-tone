:root{--case:#242521;--face:#d8d0b8;--ink:#24251f;--red:#c64631;--amber:#e7a82b;--shadow:#10110f}*{box-sizing:border-box}body{margin:0;background:#171815;color:#eee;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh;display:grid;place-items:center;padding:24px;background-image:radial-gradient(#393a33 1px,transparent 1px);background-size:5px 5px}.unit{width:min(1100px,100%);background:var(--case);padding:24px;border-radius:26px;box-shadow:0 30px 90px #000b,inset 0 1px #45463f}.face{position:relative;background:var(--face);color:var(--ink);border-radius:14px;padding:25px;box-shadow:inset 0 0 28px #806d4638;overflow:hidden}.face:after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(90deg,transparent 0 2px,#7a6b4d15 3px)}header{display:flex;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:15px;position:relative;z-index:1}.logo{font:900 clamp(30px,6vw,68px)/.8 Arial Black,sans-serif;letter-spacing:-.07em}.logo span{color:var(--red)}.serial{text-align:right;font-size:10px;letter-spacing:.15em}.grid{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr .85fr;gap:22px;margin-top:22px}.scope{background:#252821;border:9px solid #373832;border-radius:14px;box-shadow:inset 0 0 30px #000,0 2px 0 #f4edd6;height:280px;position:relative;overflow:hidden}.scope canvas{width:100%;height:100%}.scope-label{position:absolute;top:10px;left:12px;color:#b7cc83;font-size:9px;letter-spacing:.15em}.scope-status{position:absolute;right:12px;bottom:10px;color:#9aab72;font-size:9px}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.control{text-align:center}.control label{display:block;font-size:9px;letter-spacing:.13em;font-weight:bold;height:28px}.knob{--v:0deg;width:76px;height:76px;max-width:100%;aspect-ratio:1;border-radius:50%;margin:4px auto 8px;background:radial-gradient(circle at 35% 30%,#55574f 0 10%,#30312d 38%,#111 70%);border:4px solid #34 </style></head><body><div class="unit"><main class="face"><div class="screws"><i></i><i></i><i></i><i></i></div><header><div><div class="logo">FIELD <span>TONE</span></div><div>POLYMORPHIC SIGNAL INSTRUMENT / FT-01</div></div><div class="serial">HAND-CALIBRATED<br>SLIGHTLY UNSTABLE<br><b>CHICAGO, IL</b></div></header><section class="grid"><div class="scope"><canvas id="scope"></canvas><span class="scope-label">SIGNAL MONITOR / 0.8V</span><span class="scope-status" id="scopeStatus">STANDBY</span></div><div class="controls"><div class="control"><label>DRIFT</label><div class="knob" data-p="drift"></div><span class="val" id="driftV">17%</span></div><div class="control"><label>GRAIN</label><div class="knob" data-p="grain"></div><span class="val" id="grainV">42%</span></div><div class="control"><label>FIELD</label><div class="knob" data-p="field"></div><span class="val" id="fieldV">63%</span></div><div class="control"><label>DECAY</label><div class="knob" data-p="decay"></div><span class="val" id="decayV">54%</span></div><div class="control"><label>WARMTH</label><div class="knob" data-p="warmth"></div><span class="val" id="warmthV">71%</span></div><div class="control"><label>WOBBLE</label><div class="knob" data-p="wobble"></div><span class="val" id="wobbleV">24%</span></div><div class="control"><label>SPACE</label><div class="knob" data-p="space"></div><span class="val" id="spaceV">38%</span></div><div class="control"><label>OUTPUT</label><div class="knob" data-p="output"></div><span class="val" id="outputV">56%</span></div></div></section><section class="lower"><div class="patch"><div class="section-title">VOICE CHARACTER</div><div class="modes"><button class="mode on" data-wave="sawtooth">BRASS</button><button class="mode" data-wave="triangle">GLASS</button><button class="mode" data-wave="square">WIRE</button><button class="mode" data-wave="sine">AIR</button><button class="mode power" id="power">POWER</button></div><div class="hint">drag knobs vertically · A W S E D F const P={drift:17,grain:42,field:63,decay:54,warmth:71,wobble:24,space:38,output:56};let wave='sawtooth',ctx,master,filter,delay,feedback,analyser,powered=false,voices={},drone;const $=s=>document.querySelector(s),notes=[261.63,277.18,293.66,311.13,329.63,349.23,369.99,392,415.3,440,466.16,493.88,523.25],black=[1,3,6,8,10],keys='awsedftgyhujk';notes.forEach((n,i)=>{let b=document.createElement('button');b.className='key '+(black.includes(i)?'black':'');b.dataset.i=i;b.title=keys[i].toUpperCase();$('#keyboard').appendChild(b)});function init(){if(ctx)return;ctx=new AudioContext();master=ctx.createGain();filter=ctx.createBiquadFilter();delay=ctx.createDelay(.8);feedback=ctx.createGain();analyser=ctx.createAnalyser();analyser.fftSize=1024;filter.connect(delay);filter.connect(master);delay.connect(feedback);feedback.connect(delay);delay.connect(master);master.connect(analyser);analyser.connect(ctx.destination);updateAudio()}function updateAudio(){if(!ctx)return;master.gain.setTargetAtTime(P.output/100*.28,ctx.currentTime,.03);filter.type='lowpass';filter.frequency.setTargetAtTime(500+P.warmth*45,ctx.currentTime,.04);filter.Q.value=1+P.field/17;delay.delayTime.value=.08+P.space/180;feedback.gain.value=P.space/250}function play(i,id='k'+i){init();if(voices[id])return;let o=ctx.createOscillator(),g=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();o.type=wave;o.frequency.value=notes[i]*(1+(Math.random()-.5)*P.drift/400);l.frequency.value=.5+P.wobble/20;lg.gain.value=P.wobble/8;l.connect(lg);lg.connect(o.detune);g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.35,ctx.currentTime+.025);o.connect(g);g.connect(filter);o.start();l.start();voices[id]={o,g,l};document.querySelector(`[data-i="${i}"]`)?.classList.add('on');$('#scopeStatus').textContent='FIELD ACTIVE'}function stop(i,id='k'+i){let v=voices[id];if(!v)return;v.g.gain.cancelScheduledValues(ctx.currentTime);v.g.gain.setTargetAtTime(.0001,ctx.currentTime,.04+P.decay/170);setTimeout(()=>{try{v.o.stop();v.l.stop()}catch{}},800);delete voices[id];document.querySelector(`[data-i="${i}"]`)?.classList.remove('on')}document.querySelectorAll('.key').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();play(+b.dataset.i)};b.onpointerup=b.onpointerleave=()=>stop(+b.dataset.i)});document.querySelectorAll('.mode[data-wave]').forEach(b=>b.onclick=()=>{wave=b.dataset.wave;document.querySelectorAll('.mode[data-wave]').forEach(x=>x.classList.toggle('on',x===b))});$('#power').onclick=()=>{init();powered=!powered;$('#power').textContent=powered?'ON':'POWER';$('#power').classList.toggle('on',powered);$('#scopeStatus').textContent=powered?'WARMING / READY':'STANDBY'};addEventListener('keydown',e=>{if(e.repeat)return;let i=keys.indexOf(e.key.toLowerCase());if(i>=0)play(i);if(e.code==='Space'&&!drone){e.preventDefault();drone=6;play(6,'drone')}});addEventListener('keyup',e=>{let i=keys.indexOf(e.key.toLowerCase());if(i>=0)stop(i);if(e.code==='Space'&&drone!=null){stop(drone,'drone');drone=null}});document.querySelectorAll('.knob').forEach(k=>{let p=k.dataset.p,start,y;k.style.setProperty('--v',(-135+P[p]*2.7)+'deg');k.onpointerdown=e=>{start=P[p];y=e.clientY;k.setPointerCapture(e.pointerId)};k.onpointermove=e=>{if(y==null)return;P[p]=Math.max(0,Math.min(100,Math.round(start+(y-e.clientY)/1.5)));k.style.setProperty('--v',(-135+P[p]*2.7)+'deg');$('#'+p+'V').textContent=P[p]+'%';updateAudio()};k.onpointerup=()=>y=null});const c=$('#scope'),x=c.getContext('2d');function draw(){let d=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!=w*d){c.width=w*d;c.height=h*d;x.scale(d,d)}x.fillStyle='rgba(26,31,24,.18)';x.fillRect(0,0,w,h);x.strokeStyle='#31392b';x.lineWidth=1;for(let i=0;i<10;i++){x.beginPath();x.moveTo(i*w/10,0);x.lineTo(i*w/10,h);x.stroke()}for(let i=0;i<6;i++){x.beginPath();x.moveTo(0,i*h/6);x.lineTo(w,i*h/6);x.stroke()}let data=new Uint8Array(512);if(analyser)analyser.getByteTimeDomainData(data);else for(let i=0;i<data.length;i++)data[i]=128+Math.sin(i*.08+Date.now()*.001)*8;x.beginPath();x.strokeStyle='#c5df88';x.shadowColor='#b9dd73';x.shadowBlur=7;x.lineWidth=2;for(let i=0;i<data.length;i++){let xx=i/(data.length-1)*w,yy=(data[i]/255)*h+(Math.random()-.5)*P.grain/35;i?x.lineTo(xx,yy):x.moveTo(xx,yy)}x.stroke();x.shadowBlur=0;requestAnimationFrame(draw)}draw();</script></body></html>
